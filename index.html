<!DOCTYPE html>
<html data-ui-theme="nova" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef4fb">
    <script>
        try {
            document.documentElement.dataset.uiTheme =
                localStorage.getItem("moriUiTheme") === "nova" ? "nova" : "legacy";
        } catch (_) {
            document.documentElement.dataset.uiTheme = "legacy";
        }
    </script>
    <title>Absensi Kantor Camat Mori Utara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260912-single-light-darklayout8">
</head>

<body class="login-page">

    <!-- ELEMEN BACKGROUND -->
    <div class="login-bg-grid"></div>
    <div class="login-blob blob-one"></div>
    <div class="login-blob blob-two"></div>

    <div class="login-dot dot-one"></div>
    <div class="login-dot dot-two"></div>
    <div class="login-dot dot-three"></div>

    <div class="login-ring ring-one"></div>
    <div class="login-ring ring-two"></div>

    <main class="login-container">

        <!-- LOGIN PEGAWAI -->
        <section id="loginPegawaiPage" class="login-panel">

            <div class="login-card-header">
                <div class="login-logo">🏢</div>

                <div class="login-brand">
                    <span>ABSENSI PEGAWAI</span>
                    <h1>Kantor Camat Mori Utara</h1>
                </div>
            </div>

            <div class="login-card-body">

                <div class="login-welcome">
                    <span class="welcome-icon">👋</span>
                    <div>
                        <h2>Selamat Datang</h2>
                        <p>Silakan masuk menggunakan NIP Anda.</p>
                    </div>
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="loginNip">NIP</label>

                        <div class="login-input-wrapper">
                            <span class="login-input-icon">👤</span>
                            <input
                                type="text"
                                id="loginNip"
                                placeholder="Masukkan NIP"
                                inputmode="numeric"
                                autocomplete="username"
                                maxlength="18"
                                required
                            >
                        </div>
                    </div>

                    <button type="submit" class="login-btn" id="loginButton">
                        <span>Masuk</span>
                        <span class="login-btn-arrow">→</span>
                    </button>

                    <p id="loginStatus"></p>
                </form>

                <button type="button" class="admin-login-link" id="bukaLoginAdminBtn">
                    <span>🔐</span>
                    Login Admin
                </button>

            </div>
        </section>


        <!-- LOGIN ADMIN -->
        <section id="loginAdminPage" class="login-panel" hidden>

            <div class="login-card-header admin-card-header">
                <div class="login-logo">🔐</div>

                <div class="login-brand">
                    <span>AKSES ADMIN</span>
                    <h1>Kantor Camat Mori Utara</h1>
                </div>
            </div>

            <div class="login-card-body">

                <div class="login-welcome">
                    <span class="welcome-icon">👤</span>
                    <div>
                        <h2>Login Admin</h2>
                        <p>Masukkan akun administrator.</p>
                    </div>
                </div>

                <form id="adminLoginForm">

                    <div class="input-group">
                        <label for="adminLoginNip">ID Admin</label>

                        <div class="login-input-wrapper">
                            <span class="login-input-icon">👤</span>
                            <input
                                type="text"
                                id="adminLoginNip"
                                placeholder="Masukkan ID Admin"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="adminLoginPassword">Password</label>

                        <div class="login-input-wrapper">
                            <span class="login-input-icon">🔑</span>
                            <input
                                type="password"
                                id="adminLoginPassword"
                                placeholder="Masukkan password"
                                autocomplete="current-password"
                                required
                            >
                        </div>
                    </div>

                    <button type="submit" class="login-btn" id="adminLoginButton">
                        <span>Masuk Admin</span>
                        <span class="login-btn-arrow">→</span>
                    </button>

                    <p id="adminLoginStatus"></p>
                </form>

                <button type="button" class="admin-login-link" id="kembaliPegawaiBtn">
                    ← Kembali ke Login Pegawai
                </button>

            </div>
        </section>

    </main>
    <script src="js/theme.js?v=20260912-single-theme8"></script>

    <script src="js/script.js?v=20260912-running5"></script>
</body>
</html>
